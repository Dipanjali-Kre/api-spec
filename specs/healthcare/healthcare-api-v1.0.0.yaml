openapi: 3.0.3
info:
  title: Healthcare API
  version: 1.0.0
  description: |
    This API provides comprehensive patient management capabilities, including CRUD operations for patient records,
    appointments, prescriptions, diagnoses, and medical records. It adheres to strict healthcare compliance
    standards such as HIPAA, ensuring data privacy and security.

    **Compliance Requirements:**
    *   **HIPAA:** All patient data endpoints enforce robust access controls and require audit logging.
    *   **PHI (Protected Health Information):** PHI is never exposed in URL paths or query parameters.
    *   **HL7 FHIR:** Resource naming is aligned with FHIR standards where applicable.
    *   **Consent Management:** Patient consent for data sharing must be tracked and respected.

    **Security Measures:**
    *   **OAuth 2.0:** Utilizes OAuth 2.0 for authentication and authorization with role-based access (patient, provider, admin).
    *   **Audit Trail:** All access to Protected Health Information (PHI) is meticulously logged for HIPAA audit trails.
    *   **Encryption:** Data is encrypted both at rest and in transit.
    *   **Session Timeout:** Sessions automatically terminate after 15 minutes of inactivity.
    *   **Two-Factor Authentication (2FA):** Required for provider access.
  contact:
    name: Healthcare API Support
    url: https://support.healthcare.com
    email: api-support@healthcare.com
servers:
  - url: https://api.healthcare.com/v1
    description: Production server
  - url: https://staging-api.healthcare.com/v1
    description: Staging server
paths:
  /patients:
    get:
      tags:
        - Patients
      summary: Retrieve a list of patients
      description: |
        Returns a paginated list of all patient records.
        Requires `patient:read` scope.
      operationId: listPatients
      security:
        - healthcare_oauth:
            - patient:read
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: A paginated list of patients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientsList'
              examples:
                patientsListExample:
                  value:
                    items:
                      - id: "pat-001"
                        firstName: "John"
                        lastName: "Doe"
                        dateOfBirth: "1980-01-15"
                        gender: "Male"
                        address: "123 Main St, Anytown, USA"
                        phone: "+15551234567"
                        email: "john.doe@example.com"
                        medicalHistory:
                          - "Hypertension"
                          - "Type 2 Diabetes"
                        createdAt: "2023-01-01T10:00:00Z"
                        updatedAt: "2023-01-01T10:00:00Z"
                      - id: "pat-002"
                        firstName: "Jane"
                        lastName: "Smith"
                        dateOfBirth: "1992-05-20"
                        gender: "Female"
                        address: "456 Oak Ave, Othercity, USA"
                        phone: "+15559876543"
                        email: "jane.smith@example.com"
                        medicalHistory:
                          - "Asthma"
                        createdAt: "2023-01-05T11:30:00Z"
                        updatedAt: "2023-01-05T11:30:00Z"
                    total: 2
                    limit: 10
                    offset: 0
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Patients
      summary: Create a new patient record
      description: |
        Adds a new patient record to the system.
        Requires `patient:write` scope.
      operationId: createPatient
      security:
        - healthcare_oauth:
            - patient:write
      requestBody:
        description: Patient object to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPatient'
            examples:
              newPatientExample:
                value:
                  firstName: "Alice"
                  lastName: "Johnson"
                  dateOfBirth: "1975-11-03"
                  gender: "Female"
                  address: "789 Pine Ln, Smallville, USA"
                  phone: "+15551112222"
                  email: "alice.j@example.com"
      responses:
        '201':
          description: Patient record created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                createdPatientExample:
                  value:
                    id: "pat-003"
                    firstName: "Alice"
                    lastName: "Johnson"
                    dateOfBirth: "1975-11-03"
                    gender: "Female"
                    address: "789 Pine Ln, Smallville, USA"
                    phone: "+15551112222"
                    email: "alice.j@example.com"
                    medicalHistory: []
                    createdAt: "2023-03-10T09:00:00Z"
                    updatedAt: "2023-03-10T09:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /patients/{patientId}:
    get:
      tags:
        - Patients
      summary: Retrieve a single patient record
      description: |
        Returns a specific patient record by their unique ID.
        Requires `patient:read` scope.
      operationId: getPatientById
      security:
        - healthcare_oauth:
            - patient:read
      parameters:
        - name: patientId
          in: path
          description: Unique identifier of the patient.
          required: true
          schema:
            type: string
            pattern: "^pat-[0-9a-fA-F]{3}$" # Example pattern for patient IDs
          examples:
            patientIdExample:
              value: "pat-001"
      responses:
        '200':
          description: Patient record found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                patientExample:
                  value:
                    id: "pat-001"
                    firstName: "John"
                    lastName: "Doe"
                    dateOfBirth: "1980-01-15"
                    gender: "Male"
                    address: "123 Main St, Anytown, USA"
                    phone: "+15551234567"
                    email: "john.doe@example.com"
                    medicalHistory:
                      - "Hypertension"
                      - "Type 2 Diabetes"
                    createdAt: "2023-01-01T10:00:00Z"
                    updatedAt: "2023-01-01T10:00:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Patients
      summary: Update an existing patient record
      description: |
        Updates an existing patient record identified by their unique ID.
        Requires `patient:write` scope.
      operationId: updatePatient
      security:
        - healthcare_oauth:
            - patient:write
      parameters:
        - name: patientId
          in: path
          description: Unique identifier of the patient to update.
          required: true
          schema:
            type: string
            pattern: "^pat-[0-9a-fA-F]{3}$"
          examples:
            patientIdExample:
              value: "pat-001"
      requestBody:
        description: Patient object with updated fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatient'
            examples:
              updatePatientExample:
                value:
                  firstName: "Jonathan"
                  address: "456 New St, Anytown, USA"
                  medicalHistory:
                    - "Hypertension"
                    - "Type 2 Diabetes"
                    - "Seasonal Allergies"
      responses:
        '200':
          description: Patient record updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
              examples:
                updatedPatientExample:
                  value:
                    id: "pat-001"
                    firstName: "Jonathan"
                    lastName: "Doe"
                    dateOfBirth: "1980-01-15"
                    gender: "Male"
                    address: "456 New St, Anytown, USA"
                    phone: "+15551234567"
                    email: "john.doe@example.com"
                    medicalHistory:
                      - "Hypertension"
                      - "Type 2 Diabetes"
                      - "Seasonal Allergies"
                    createdAt: "2023-01-01T10:00:00Z"
                    updatedAt: "2023-03-10T15:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Patients
      summary: Delete a patient record
      description: |
        Deletes a patient record by their unique ID.
        Requires `patient:delete` scope.
      operationId: deletePatient
      security:
        - healthcare_oauth:
            - patient:delete
      parameters:
        - name: patientId
          in: path
          description: Unique identifier of the patient to delete.
          required: true
          schema:
            type: string
            pattern: "^pat-[0-9a-fA-F]{3}$"
          examples:
            patientIdExample:
              value: "pat-001"
      responses:
        '204':
          description: Patient record deleted successfully. No content.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Patient:
      type: object
      description: Represents a patient record in the healthcare system.
      required:
        - id
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - address
        - phone
        - email
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier for the patient.
          readOnly: true
          example: "pat-001"
        firstName:
          type: string
          description: First name of the patient.
          example: "John"
        lastName:
          type: string
          description: Last name of the patient.
          example: "Doe"
        dateOfBirth:
          type: string
          format: date
          description: Date of birth of the patient (YYYY-MM-DD).
          example: "1980-01-15"
        gender:
          type: string
          enum: [ "Male", "Female", "Other", "Prefer not to say" ]
          description: Gender of the patient.
          example: "Male"
        address:
          type: string
          description: Full address of the patient.
          example: "123 Main St, Anytown, USA"
        phone:
          type: string
          pattern: "^\+[1-9]\d{1,14}$" # E.164 format
          description: Phone number of the patient, E.164 format.
          example: "+15551234567"
        email:
          type: string
          format: email
          description: Email address of the patient.
          example: "john.doe@example.com"
        medicalHistory:
          type: array
          description: A list of medical conditions or significant history.
          items:
            type: string
          example:
            - "Hypertension"
            - "Type 2 Diabetes"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the patient record was created.
          readOnly: true
          example: "2023-01-01T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the patient record was last updated.
          readOnly: true
          example: "2023-01-01T10:00:00Z"
    NewPatient:
      type: object
      description: Data required to create a new patient record.
      required:
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - address
        - phone
        - email
      properties:
        firstName:
          type: string
          description: First name of the patient.
          example: "Alice"
        lastName:
          type: string
          description: Last name of the patient.
          example: "Johnson"
        dateOfBirth:
          type: string
          format: date
          description: Date of birth of the patient (YYYY-MM-DD).
          example: "1975-11-03"
        gender:
          type: string
          enum: [ "Male", "Female", "Other", "Prefer not to say" ]
          description: Gender of the patient.
          example: "Female"
        address:
          type: string
          description: Full address of the patient.
          example: "789 Pine Ln, Smallville, USA"
        phone:
          type: string
          pattern: "^\+[1-9]\d{1,14}$"
          description: Phone number of the patient, E.164 format.
          example: "+15551112222"
        email:
          type: string
          format: email
          description: Email address of the patient.
          example: "alice.j@example.com"
        medicalHistory:
          type: array
          description: Optional list of initial medical conditions.
          items:
            type: string
          example: []
    UpdatePatient:
      type: object
      description: Data fields that can be updated for an existing patient record.
      properties:
        firstName:
          type: string
          description: First name of the patient.
          example: "Jonathan"
        lastName:
          type: string
          description: Last name of the patient.
          example: "Doe"
        dateOfBirth:
          type: string
          format: date
          description: Date of birth of the patient (YYYY-MM-DD).
          example: "1980-01-15"
        gender:
          type: string
          enum: [ "Male", "Female", "Other", "Prefer not to say" ]
          description: Gender of the patient.
          example: "Male"
        address:
          type: string
          description: Full address of the patient.
          example: "456 New St, Anytown, USA"
        phone:
          type: string
          pattern: "^\+[1-9]\d{1,14}$"
          description: Phone number of the patient, E.164 format.
          example: "+15551234567"
        email:
          type: string
          format: email
          description: Email address of the patient.
          example: "john.doe@example.com"
        medicalHistory:
          type: array
          description: A list of medical conditions or significant history.
          items:
            type: string
          example:
            - "Hypertension"
            - "Type 2 Diabetes"
            - "Seasonal Allergies"
    PatientsList:
      type: object
      description: A paginated list of patient records.
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          description: Array of patient objects.
          items:
            $ref: '#/components/schemas/Patient'
        total:
          type: integer
          format: int32
          description: Total number of patient records available.
          minimum: 0
          example: 100
        limit:
          type: integer
          format: int32
          description: The maximum number of items returned in the current page.
          minimum: 1
          example: 10
        offset:
          type: integer
          format: int32
          description: The number of items skipped before starting to collect the result set.
          minimum: 0
          example: 0
    Error:
      type: object
      description: Standard error response format.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: A unique error code.
          example: "INVALID_INPUT"
        message:
          type: string
          description: A human-readable explanation of the error.
          example: "The provided patient ID is invalid."
  parameters:
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
      examples:
        limitExample:
          value: 20
    OffsetParam:
      name: offset
      in: query
      description: Number of items to skip before starting to collect the result set.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      examples:
        offsetExample:
          value: 10
  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorizedExample:
              value:
                code: "UNAUTHORIZED"
                message: "Authentication required or invalid token."
    ForbiddenError:
      description: The client does not have permission to access the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbiddenExample:
              value:
                code: "FORBIDDEN"
                message: "Insufficient permissions to perform this action."
    NotFoundError:
      description: The specified resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFoundExample:
              value:
                code: "NOT_FOUND"
                message: "Patient with the given ID was not found."
    BadRequestError:
      description: The request was malformed or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequestExample:
              value:
                code: "BAD_REQUEST"
                message: "Invalid input data. Please check your request body."
    InternalServerError:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internalServerErrorExample:
              value:
                code: "INTERNAL_SERVER_ERROR"
                message: "An unexpected error occurred. Please try again later."
  securitySchemes:
    healthcare_oauth:
      type: oauth2
      description: OAuth 2.0 for authentication and authorization.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.healthcare.com/oauth2/authorize
          tokenUrl: https://auth.healthcare.com/oauth2/token
          scopes:
            patient:read: Read patient records
            patient:write: Create and update patient records
            patient:delete: Delete patient records
            appointment:read: Read appointment details
            appointment:write: Create and update appointments
            prescription:read: Read prescription details
            prescription:write: Create and update prescriptions
            admin:full_access: Full administrative access