info:
  title: Banking API
  version: 1.0.0
  description: |
    This API provides a comprehensive set of services for managing banking operations,
    including accounts, transactions, payments, cards, and customer information.
    It adheres to strict security and compliance standards such as PCI-DSS, PSD2/Open Banking, and KYC/AML.

    **Key Features:**
    *   **Account Management:** View and manage customer bank accounts.
    *   **Transaction Processing:** Initiate and track financial transactions.
    *   **Payment Services:** Facilitate secure payment initiations.
    *   **Card Management:** Manage customer debit/credit cards, including blocking.
    *   **Customer Onboarding:** Support for KYC/AML verification processes.
    *   **Consent Management:** PSD2/Open Banking compliant consent handling.

    **Compliance & Security:**
    *   **PCI-DSS:** Full card numbers (PAN) are never exposed. Masked card numbers are used in responses.
    *   **PSD2/Open Banking:** Includes consent management endpoints.
    *   **KYC/AML:** Customer onboarding includes identity verification steps.
    *   **Monetary Amounts:** All monetary amounts are represented in integer minor units (e.g., cents) or explicit decimal with ISO 4217 `currencyCode`.
    *   **OAuth 2.0:** Scope-based access control for secure operations.
