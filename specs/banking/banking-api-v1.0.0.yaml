openapi: 3.0.3
info:
  title: Banking API
  version: 1.0.0
  description: |
    This API provides a comprehensive set of services for managing banking operations,
    including accounts, transactions, payments, cards, and customer information.
    It adheres to strict security and compliance standards such as PCI-DSS, PSD2, and KYC/AML.

    **Compliance Notes:**
    *   **PCI-DSS**: Full card numbers (PAN) are never exposed. Masked card numbers are used in responses.
    *   **PSD2/Open Banking**: Consent management endpoints are provided for third-party access.
    *   **KYC/AML**: Customer onboarding includes identity verification (`kycStatus`).
    *   **Monetary Amounts**: All monetary amounts are represented as integer minor units (e.g., cents for USD) or explicit decimal with `currencyCode` (ISO 4217).

    **Security Notes:**
    *   **OAuth 2.0**: Access is controlled via OAuth 2.0 with scope-based authorization.
    *   **SCA**: Strong Customer Authentication is required for payment initiation.
    *   **Rate Limiting**: Sensitive endpoints are subject to rate limiting.
    *   **Idempotency**: `Idempotency-Key` header is required for all `POST` operations to ensure transaction safety.
servers:
